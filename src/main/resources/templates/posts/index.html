<!DOCTYPE html>
    <html xmlns:th="http://www.thymeleaf.org"
          xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5" >
    <head lang="en"  th:replace="~{core/head :: head}"></head>
    <body>

        <div th:replace="~{core/navbar :: div}"></div>

        <div class="container">
            <div th:replace="~{core/sidebar :: div}"></div>
            <div id="feed" class="container-posts">
                <div class="card post-something">
                    <form class="form-post" th:action="@{/posts}" th:object="${post}" method="POST">
                        <h3><i class="fa-regular fa-message"></i></h3>
                        <input type="hidden" th:attr="name='userId'" th:value="${#authentication.principal.attributes['sub']}">
                        <input type="hidden" th:attr="name='friendsOnly'" th:value="false">
                        <input type="hidden" th:attr="name='dateTime'" th:value="${null}">
                        <input type="text"
                               class="input-post"
                               th:field="*{content}"
                               th:placeholder="'What\'s on your mind, ' + ${#authentication.principal.attributes['nickname']} + '?'"
                        />
                        <input type="submit" class="submit-post" value="post!" />
                    </form>
                </div>
                <div th:replace="~{posts/posts :: div}"></div>
            </div>
        </div>

        <div id="comment-template" class="comment-thread hidden">
            <div id="comment-group-template" class="comment-group"
                th:data-post-id="${null}"
                th:data-user-id="${#authentication.principal.attributes['sub']}"
                th:data-nickname="${null}"
                th:data-parent-id="${null}"
                th:data-ancestor-id="${null}"
                th:data-liked="${false}">
                <div class="comment-tab hidden">
                    <h6 class="card-post-icon-group comment-like-group">
                        <i class="fa-regular fa-thumbs-up"></i>
                        Like
                    </h6>
                    <h6 class="card-post-icon-group comment-liked-group">
                        <i class="fa-solid fa-thumbs-up"></i>
                        Liked
                    </h6>
                    <h6 class="card-post-icon-group comment-reply-button">
                        <i class="fa-regular fa-comment"></i>
                        Reply
                    </h6>
                </div>
                <div class="comment">
                    <h6 class="comment-header"></h6>
                    <p class="comment-content"></p>
                    <div class="card-post-icon-group mt-16 hidden">
                        <div class="like-icon"></div>
                        <h6 class="who-liked-this"></h6>
                    </div>
                    <div class="reply-to-comment hidden">
                        <h3><i class="fa-regular fa-message"></i></h3>
                        <form class="form-comment-reply" th:action="@{/comments}" th:object="${post}" method="POST">
                            <input type="hidden" th:attr="name='userId'" th:value="${#authentication.principal.attributes['sub']}">
                            <input type="hidden" th:attr="name='parentId'" th:value="${null}">
                            <input type="hidden" th:attr="name='friendsOnly'" th:value="${false}">
                            <input type="hidden" th:attr="name='dateTime'" th:value="${null}">
                            <input type="text"
                                   class="input-post"
                                   th:field="*{content}"
                                   th:placeholder="'Reply to this comment...'"
                            />
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div id="copper-bars-template" class="copper-bars hidden">
            <div class="copper-bars-left"></div>
            <div class="copper-bars-center"></div>
            <div class="copper-bars-right"></div>
        </div>

        <script th:inline="javascript">
            // This script aligns the comments depending on which reply thread they're part of
            const comments = document.querySelectorAll('.comment-group:not(#comment-group-template)');
            var lastCommentId = -1;
            var lastCommentParent = -1;
            comments.forEach(comment => {
                const commentId = comment.dataset.postId;
                const parentId = comment.dataset.parentId;
                if (parentId == lastCommentParent) {
                    comment.parentElement.classList.add('in-thread');
                } else if (parentId != lastCommentId) {
                    comment.parentElement.classList.add('mt-16');
                }
                lastCommentId = commentId;
                lastCommentParent = parentId;
            });
        </script>

        <script th:inline="javascript">
            const protocol = window.location.protocol;
            const root = window.location.host;

            function handleLike(card, likeGroup, likedGroup) {
                event.preventDefault(); // Don't reload the page.

                const likeString = card.querySelector('.who-liked-this');
                const postId = card.dataset.postId;

                fetch(`${protocol}//${root}/likes/${postId}`, {
                    method: 'POST'
                })
                .then(response => response.text())
                .then(newLikesText => {
                    likeString.textContent = newLikesText;
                    likeString.parentElement.classList.remove('hidden');

                    card.dataset.liked = 'true';
                    likeGroup.classList.add('hidden');
                    likedGroup.classList.remove('hidden');
                })
                .catch(error => {
                    console.error('Error:', error);
                });
            }

            function handleUnlike(card, likeGroup, likedGroup) {
                event.preventDefault(); // Don't reload the page.

                const likeString = card.querySelector('.who-liked-this');
                const postId = card.dataset.postId;

                fetch(`${protocol}//${root}/likes/${postId}`, {
                    method: 'DELETE'
                })
                .then(response => response.text())
                .then(newLikesText => {
                    likeString.textContent = newLikesText;
                    if (likeString.textContent == '') {
                        likeString.parentElement.classList.add('hidden');
                    }

                    card.dataset.liked = 'false';
                    likedGroup.classList.add('hidden');
                    likeGroup.classList.remove('hidden');
                })
                .catch(error => {
                    console.error('Error:', error);
                });
            }

            function createCommentThread(comment, postId, parentUserId, parentNickname) {
                const postedByUser = true;

                const template = document.getElementById('comment-template');
                const newComment = template.cloneNode(true);
                const commentGroup = newComment.querySelector('.comment-group');

                newComment.removeAttribute('id')
                commentGroup.removeAttribute('id')

                commentGroup.dataset.postId = comment.id;
                commentGroup.dataset.nickname = comment.nickname;
                commentGroup.dataset.parentId = comment.parentId;
                commentGroup.dataset.ancestorId = postId;
                commentGroup.dataset.liked = comment.liked;

                const headerString = 'You responded' + (comment.parentId == postId ? '' : ' to ') + (parentUserId == comment.userId ? 'yourself' : parentNickname) + ' (just now)';

                commentGroup.querySelector('.comment-header').textContent = headerString;
                commentGroup.querySelector('.comment-content').textContent = comment.content;
                commentGroup.querySelector('input[name="parentId"]').value = comment.id;

                newComment.classList.remove('hidden');
                styleCommentGroup(commentGroup);

                return newComment;
            }

            function handleCommentReply(commentGroup, event) {
                event.preventDefault(); // Don't reload the page.

                const postId = commentGroup.dataset.ancestorId;
                const parentUserId = commentGroup.dataset.userId;
                const parentNickname = commentGroup.dataset.nickname;

                const formInput = commentGroup.querySelector('.input-post');
                const parentThread = commentGroup.parentElement;
                const counterElement = document.getElementById('comment-counter-' + postId);
                const commentsCounter = counterElement.querySelector('.comments-counter');

                const formData = new FormData(event.target);

                formInput.value = '';

                fetch(event.target.action, {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(comment => {
                    const newComment = createCommentThread(comment, postId, parentUserId, parentNickname);
                    parentThread.insertAdjacentElement('beforeend', newComment);

                    // styling:
                    const previousElement = newComment.previousElementSibling;
                    if (previousElement.dataset.postId == comment.parentId) {
                        const copperBars = document.querySelector('#copper-bars-template').cloneNode(true);
                        copperBars.removeAttribute('id');
                        copperBars.classList.remove('hidden');
                        parentThread.insertBefore(copperBars, newComment);
                    } else {
                        newComment.classList.add('in-thread');
                    }
                    newComment.nextElementSibling.classList.remove('in-thread');
                    newComment.nextElementSibling.classList.add('mt-16');
                })
                .catch(error => {
                    console.error('Error:', error);
                });

                commentsCounter.innerText = parseInt(commentsCounter.innerText) + 1;
                counterElement.classList.remove('hidden');

                const commentMargins = 20;
                const card = document.getElementById('post-' + postId);
                const newCommentDiv = card.querySelector('.comments-section > :nth-last-child(2)');
                const height = newCommentDiv.offsetHeight + commentMargins;

                window.scrollBy({
                    top: height,
                    behavior: 'smooth'
                });

                newCommentDiv.click(); // Hide the reply input
            }

            function toggleComments(card, commentButton) {
                const commentsSection = card.querySelector('.comments-section');

                commentsSection.classList.toggle('hidden');
                const rect = commentButton.getBoundingClientRect();

                const isInView =
                    rect.top >= 0 &&
                    rect.bottom <= (window.innerHeight || document.documentElement.clientHeight);

                if (!commentsSection.classList.contains('hidden') && !isInView) {
                    const offset = 64;
                    const elementPosition = commentButton.getBoundingClientRect().top + window.scrollY;
                    const offsetPosition = elementPosition - window.innerHeight + commentButton.offsetHeight + offset;

                    window.scrollTo({
                        top: offsetPosition,
                        behavior: 'smooth'
                    });
                }
            }

            function unHighlightComment(event) {
                const commentGroup = event.currentTarget;
                const comment = commentGroup.querySelector('.comment');
                const commentTab = commentGroup.querySelector('.comment-tab');

                commentTab.classList.add('hidden');
                comment.classList.remove('comment-active')
            }

            function toggleReplyForm(event, replyForm, commentGroup) {
                event.stopPropagation();

                const replyButton = commentGroup.querySelector('.comment-reply-button');

                document.removeEventListener('click', hideReplyFormListener);

                // Hide replyForm if user clicks away
                function hideReplyFormListener(clickEvent) {
                    if (!replyForm.contains(clickEvent.target) && clickEvent.target !== replyButton) {
                        replyForm.parentElement.classList.add('hidden');
                        commentGroup.addEventListener('mouseout', unHighlightComment);
                    }
                }

                // Toggle replyForm
                if (replyForm.parentElement.classList.contains('hidden')) {
                    commentGroup.removeEventListener('mouseout', unHighlightComment);
                    replyForm.parentElement.classList.remove('hidden');
                    document.addEventListener('click', hideReplyFormListener);
                } else {
                    replyForm.parentElement.classList.add('hidden');
                    commentGroup.addEventListener('mouseout', unHighlightComment);
                }
            }

            function styleCommentGroup(commentGroup) {
                const comment = commentGroup.querySelector('.comment');
                const commentTab = commentGroup.querySelector('.comment-tab');
                const replyButton = commentTab.querySelector('.comment-reply-button');
                const replyForm = commentGroup.querySelector('.form-comment-reply');
                const likeGroup = commentTab.querySelector('.comment-like-group');
                const likedGroup = commentTab.querySelector('.comment-liked-group');

                const likedByUser = commentGroup.dataset.liked;

                if (likedByUser == "true") {
                    likeGroup.classList.add('hidden');
                } else {
                    likedGroup.classList.add('hidden');
                }

                likeGroup.addEventListener('click', function() {
                    handleLike(commentGroup, likeGroup, likedGroup)
                });
                likedGroup.addEventListener('click', function() {
                    handleUnlike(commentGroup, likeGroup, likedGroup)
                });

                commentGroup.addEventListener('mouseover', function() {
                    commentTab.classList.remove('hidden');
                    comment.classList.add('comment-active');
                });
                commentGroup.addEventListener('mouseout', unHighlightComment);
                replyButton.addEventListener('click', function(event) {
                    toggleReplyForm(event, replyForm, commentGroup);
                });
                replyForm.addEventListener('submit', function(event) {
                    handleCommentReply(commentGroup, event);
                });
            }

            document.addEventListener('DOMContentLoaded', function() {
                const cards = document.querySelectorAll('.card-post');

                cards.forEach(card => {
                    const likedByUser = card.dataset.liked;
                    const likeGroup = card.querySelector('.like-group');
                    const likedGroup = card.querySelector('.liked-group');
                    const commentGroups = card.querySelectorAll('.comment-group');
                    const commentButton = card.querySelector('.comment-button');

                    if (likedByUser == "true") {
                        likeGroup.classList.add('hidden');
                    } else {
                        likedGroup.classList.add('hidden');
                    }

                    likeGroup.addEventListener('click', function() {
                        handleLike(card, likeGroup, likedGroup)
                    });
                    likedGroup.addEventListener('click', function() {
                        handleUnlike(card, likeGroup, likedGroup);
                    });
                    commentButton.addEventListener('click', function() {
                        toggleComments(card, commentButton);
                    });
                    commentGroups.forEach(styleCommentGroup);
                });
            });
        </script>
    </body>
</html>
