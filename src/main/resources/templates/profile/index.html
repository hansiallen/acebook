<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5" >
<head lang="en"  th:replace="~{core/head :: head}"></head>
<body>
<link rel="stylesheet" href="/css/profile.css">
<div th:replace="~{core/navbar :: div}"></div>

<div class="container">
    <div th:replace="~{core/sidebar :: div}"></div>


    <div style="width: 100%; display: flex; flex-direction: column;">
        <div class="profile-container">
            <span th:if="${isYourProfile == true}"><a href="/profile/edit"><p style="color: black; text-decoration: underline; margin-bottom: 10px;">Edit your profile</p></a></span>
            <div class="profile-container-2">
                <img th:src="${profile.profilePictureUrl}" class="profile-page-picture" alt="">
                <div class="profile-col-1">
                    <p th:text="${'@' + nickname}" class="profile-page-nickname"></p>
                    <span th:if="${profile.location != null}"><p th:text="${'Location: ' + profile.location}" class="profile-page-attr"></p></span>
                    <span th:if="${profile.websiteUrl != null}"><a th:href="${profile.websiteUrl}"><p th:text="${profile.websiteUrl}" class="profile-page-attr"></p></a></span>

                    <button onclick="followUser()" id="profile-follow-button">Follow</button>
                </div>
                <div class="profile-col-2"><p th:text="${profile.bio}" class="profile-page-bio"></p></div>
            </div>
        </div>




        <div id="feed" class="container-posts" style="width:auto;"><div th:replace="~{posts/posts :: div}"></div></div>
<!--        <div th:replace="~{posts/post_container :: div}"></div>-->
    </div>
</div>

<script th:inline="javascript">
    // This script aligns the comments depending on which reply thread they're part of
    const comments = document.querySelectorAll('.comment-group:not(#comment-group-template)');
    var lastCommentId = -1;
    var lastCommentParent = -1;
    comments.forEach(comment => {
        const commentId = comment.dataset.postId;
        const parentId = comment.dataset.parentId;
        if (parentId == lastCommentParent) {
            comment.parentElement.classList.add('in-thread');
        } else if (parentId != lastCommentId) {
            comment.parentElement.classList.add('mt-16');
        }
        lastCommentId = commentId;
        lastCommentParent = parentId;
    });
</script>

<script th:inline="javascript">
    const protocol = window.location.protocol;
    const root = window.location.host;

    function handleLike(card, likeGroup, likedGroup) {
        event.preventDefault(); // Don't reload the page.

        const likeString = card.querySelector('.who-liked-this');
        const postId = card.dataset.postId;

        fetch(`${protocol}//${root}/likes/${postId}`, {
            method: 'POST'
        })
        .then(response => response.text())
        .then(newLikesText => {
            likeString.textContent = newLikesText;
            likeString.parentElement.classList.remove('hidden');

            card.dataset.liked = 'true';
            likeGroup.classList.add('hidden');
            likedGroup.classList.remove('hidden');
        })
        .catch(error => {
            console.error('Error:', error);
        });
    }

    function handleUnlike(card, likeGroup, likedGroup) {
        event.preventDefault(); // Don't reload the page.

        const likeString = card.querySelector('.who-liked-this');
        const postId = card.dataset.postId;

        fetch(`${protocol}//${root}/likes/${postId}`, {
            method: 'DELETE'
        })
        .then(response => response.text())
        .then(newLikesText => {
            likeString.textContent = newLikesText;
            if (likeString.textContent == '') {
                likeString.parentElement.classList.add('hidden');
            }

            card.dataset.liked = 'false';
            likedGroup.classList.add('hidden');
            likeGroup.classList.remove('hidden');
        })
        .catch(error => {
            console.error('Error:', error);
        });
    }

    function editCard(card, postContent, editButton, postId) {
        const editGroup = card.querySelector('.post-edit');
        const input = card.querySelector('.post-edit-input');

        input.value = postContent.innerText;
        postContent.classList.add('hidden');
        editGroup.classList.remove('hidden');
        editButton.classList.add('hidden');
        input.focus();

        function cancelEdit(event) {
            if (event.target !== input) {
                editGroup.classList.add('hidden');
                postContent.classList.remove('hidden');
                editButton.classList.remove('hidden');
            }
        }

        document.addEventListener('click', cancelEdit);
    }

    function submitPostEdit(editForm, postContent, postId) {
        const editInput = editForm.querySelector('.post-edit-input');
        const newPostContent = editInput.value;

        fetch(`${protocol}//${root}/posts/${postId}`, {
            method: 'PATCH',
            body: newPostContent
        })
        .then(response => {
            if (response.ok) {
                postContent.innerText = newPostContent;
                document.body.click(); // hide edit field
            }
        })
        .catch(error => {
            console.error('Error updating post:', error.message);
        });
    }

    function createCommentThread(comment, postId, parentUserId, parentNickname) {
        const postedByUser = true;

        const template = document.getElementById('comment-template');
        const newComment = template.cloneNode(true);
        const commentGroup = newComment.querySelector('.comment-group');

        newComment.removeAttribute('id')
        commentGroup.removeAttribute('id')

        commentGroup.dataset.postId = comment.id;
        commentGroup.dataset.nickname = comment.nickname;
        commentGroup.dataset.parentId = comment.parentId;
        commentGroup.dataset.ancestorId = postId;
        commentGroup.dataset.liked = comment.liked;

        const headerString = 'You responded' + (comment.parentId == postId ? '' : ' to ' + (parentUserId == comment.userId ? 'yourself' : parentNickname)) + ' (just now)';

        commentGroup.querySelector('.comment-header').textContent = headerString;
        commentGroup.querySelector('.comment-content').textContent = comment.content;
        commentGroup.querySelector('input[name="parentId"]').value = comment.id;

        newComment.classList.remove('hidden');
        styleCommentGroup(commentGroup);

        return newComment;
    }

    function handleComment(event, postId, parentUserId, parentNickname, parentThread, formInput) {
        event.preventDefault(); // Don't reload the page.

        const counterElement = document.getElementById('comment-counter-' + postId);
        const commentsCounter = counterElement.querySelector('.comments-counter');

        const formData = new FormData(event.target);

        formInput.value = '';

        fetch(event.target.action, {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(comment => {
            const newComment = createCommentThread(comment, postId, parentUserId, parentNickname);

            if (parentUserId) {
                parentThread.insertAdjacentElement('beforeend', newComment);
            } else {
                parentThread.insertBefore(newComment, event.target.parentElement)
            }

            // styling:
            const previousElement = newComment.previousElementSibling;
            if (!previousElement) {
                newComment.classList.add('mt-16');
            } else if (previousElement.dataset.postId == comment.parentId) {
                const copperBars = document.querySelector('#copper-bars-template').cloneNode(true);
                copperBars.removeAttribute('id');
                copperBars.classList.remove('hidden');
                parentThread.insertBefore(copperBars, newComment);
            } else if (previousElement.lastElementChild.dataset.parentId != comment.parentId) {
                newComment.classList.add('mt-16');
            } else {
                newComment.classList.add('in-thread');
            }

            parentThread.nextElementSibling.classList.remove('in-thread');
            parentThread.nextElementSibling.classList.add('mt-16');

            if (!isInView(newComment)) {
                newComment.scrollIntoView({
                    behavior: 'smooth',
                    block: 'end',
                    inline: 'nearest'
                });
            }

            commentsCounter.innerText = parseInt(commentsCounter.innerText) + 1;
            counterElement.classList.remove('hidden');

            document.body.click(); // Hide the reply input
        })
        .catch(error => {
            console.error('Error:', error);
        });
    }

    function handleCommentReply(commentGroup, event) {
        const postId = commentGroup.dataset.ancestorId;
        const parentUserId = commentGroup.dataset.userId;
        const parentNickname = commentGroup.dataset.nickname;

        const formInput = commentGroup.querySelector('.input-post');
        const parentThread = commentGroup.parentElement;

        handleComment(event, postId, parentUserId, parentNickname, parentThread, formInput);
    }

    function toggleComments(card, commentButton) {
        const commentsSection = card.querySelector('.comments-section');

        commentsSection.classList.toggle('hidden');
        const rect = commentButton.getBoundingClientRect();

        const isInView =
            rect.top >= 0 &&
            rect.bottom <= (window.innerHeight || document.documentElement.clientHeight);

        if (!commentsSection.classList.contains('hidden') && !isInView) {
            const offset = 64;
            const elementPosition = commentButton.getBoundingClientRect().top + window.scrollY;
            const offsetPosition = elementPosition - window.innerHeight + commentButton.offsetHeight + offset;

            window.scrollTo({
                top: offsetPosition,
                behavior: 'smooth'
            });
        }
    }

    function unHighlightComment(commentGroup) {
        const comment = commentGroup.querySelector('.comment');
        const commentTab = commentGroup.querySelector('.comment-tab');

        commentTab.classList.add('hidden');
        comment.classList.remove('comment-active')
    }

    function toggleReplyForm(event, replyForm, commentGroup, handleMouseOut) {
        event.stopPropagation();

        const replyButton = commentGroup.querySelector('.comment-reply-button');
        const replyInput = replyForm.querySelector('.input-post');

        // Hide replyForm if user clicks away
        function hideReplyFormListener(clickEvent) {
            if (!commentGroup.contains(clickEvent.target) && clickEvent.target !== replyButton) {
                replyForm.parentElement.classList.add('hidden');
                unHighlightComment(commentGroup);
                commentGroup.addEventListener('mouseout', handleMouseOut);
            }
        }

        // Toggle replyForm
        if (replyForm.parentElement.classList.contains('hidden')) {
            commentGroup.removeEventListener('mouseout', handleMouseOut);
            replyForm.parentElement.classList.remove('hidden');
            replyInput.focus();
            document.addEventListener('click', hideReplyFormListener);
        } else {
            replyForm.parentElement.classList.add('hidden');
            commentGroup.addEventListener('mouseout', handleMouseOut);
        }
    }

    function styleCommentGroup(commentGroup) {
        const postId = commentGroup.dataset.postId;
        const comment = commentGroup.querySelector('.comment');
        const commentTab = commentGroup.querySelector('.comment-tab');
        const replyButton = commentTab.querySelector('.comment-reply-button');
        const replyForm = commentGroup.querySelector('.form-comment-reply');
        const likeGroup = commentTab.querySelector('.comment-like-group');
        const likedGroup = commentTab.querySelector('.comment-liked-group');
        const editGroup = commentTab.querySelector('.comment-edit-group');
        const deleteGroup = commentTab.querySelector('.comment-delete-group');

        const likedByUser = commentGroup.dataset.liked;

        if (likedByUser == "true") {
            likeGroup.classList.add('hidden');
        } else {
            likedGroup.classList.add('hidden');
        }

        likeGroup.addEventListener('click', function() {
            handleLike(commentGroup, likeGroup, likedGroup)
        });
        likedGroup.addEventListener('click', function() {
            handleUnlike(commentGroup, likeGroup, likedGroup)
        });
        deleteGroup.addEventListener('click', function () {
            deletePost(commentGroup.parentElement, postId);
            // delete copper-bars, reapply styling if necessary
        });

        commentGroup.addEventListener('mouseover', function() {
            commentTab.classList.remove('hidden');
            comment.classList.add('comment-active');
        });
        const handleMouseOut = () => unHighlightComment(commentGroup);
        commentGroup.addEventListener('mouseout', handleMouseOut);
        replyButton.addEventListener('click', function(event) {
            toggleReplyForm(event, replyForm, commentGroup, handleMouseOut);
        });
        replyForm.addEventListener('submit', function(event) {
            handleCommentReply(commentGroup, event);
        });
    }

    function deletePost(post, postId) {
        const isConfirmed = confirm("Are you sure you want to delete this?");
        if (isConfirmed) {
            const counterShouldUpdate = post.parentId !== null;
            const card = post.closest('.card-post');
            fetch(`${protocol}//${root}/posts/${postId}`, {
                method: 'DELETE'
            })
            .then(response => {
                if (response.ok) {
                    post.remove();
                    if (counterShouldUpdate) {
                        const counter = card.querySelector('.comments-counter');
                        counter.innerText = parseInt(counter.innerText) - 1;
                    }
                }
            })
            .catch(error => {
                console.error('Error deleting post:', error.message);
            });
        }
    }

    function isInView(element) {
        const rect = element.getBoundingClientRect();
        const windowHeight = window.innerHeight || document.documentElement.clientHeight;
        const minDistanceFromBottom = 24;

        return (
            rect.bottom <= windowHeight - minDistanceFromBottom &&
            rect.bottom > 0
        );
    }

    document.addEventListener('DOMContentLoaded', function() {
        const cards = document.querySelectorAll('.card-post');

        cards.forEach(card => {
            const postId = card.dataset.postId;
            const likedByUser = card.dataset.liked;
            const likeGroup = card.querySelector('.like-group');
            const likedGroup = card.querySelector('.liked-group');
            const editButton = card.querySelector('.card-edit-button');
            const editForm = card.querySelector('.post-edit-form');
            const deleteButton = card.querySelector('.card-delete-button');
            const postContent = card.querySelector('.post-content');
            const commentSection = card.querySelector('.comments-section');
            const commentGroups = card.querySelectorAll('.comment-group');
            const commentButton = card.querySelector('.comment-button');
            const commentForm = card.querySelector('.form-post-comment');
            const formInput = commentForm.querySelector('input[name="content"]');

            if (likedByUser == "true") {
                likeGroup.classList.add('hidden');
            } else {
                likedGroup.classList.add('hidden');
            }

            likeGroup.addEventListener('click', function() {
                handleLike(card, likeGroup, likedGroup)
            });
            likedGroup.addEventListener('click', function() {
                handleUnlike(card, likeGroup, likedGroup);
            });
            if (deleteButton) {
                const editTargets = [postContent, editButton]
                editTargets.forEach(target => {
                    target.addEventListener('click', function(e) {
                        e.stopPropagation();
                        editCard(card, postContent, editButton, postId);
                    });
                });
                editForm.addEventListener('submit', function(e) {
                    e.preventDefault(); // Prevent form submission
                    submitPostEdit(editForm, postContent, postId);
                });
                deleteButton.addEventListener('click', function() {
                    deletePost(card, postId);
                });
            }
            commentButton.addEventListener('click', function() {
                toggleComments(card, commentButton);
            });
            commentForm.addEventListener('submit', function(event) {
                handleComment(event, postId, null, null, commentSection, formInput);
            });
            commentGroups.forEach(styleCommentGroup);
        });
    });
</script>
</body>
</html>
