<div th:fragment="div">
    <div th:id="'notification-' + ${notification.id}"
         th:each="notification: ${notifications}">
         <div class="notification-item notification-info notifications-list card-post-body card-post">
                <a th:href="${notification.link}">
                <p th:text="${notification.message}"></p>
                <h6 th:text="${notification.timeSince()}"></h6>
                </a>
         </div>
    </div>
</div>
